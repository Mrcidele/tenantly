name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  image:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      # 1) Migrations "expand" (aditivas, compatíveis com a versão em produção),
      #    com o papel dono do schema, ANTES de trocar o código.
      # 2) Rolling update dos containers app/horizon/scheduler (Octane recarrega workers).
      # 3) Migrations "contract" só num deploy posterior (ver docs/operations.md).
      - name: Migrar e publicar
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then echo "DEPLOY_HOST não configurado; pulando."; exit 0; fi
          mkdir -p ~/.ssh && echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST" "
            set -e
            docker pull $IMAGE
            docker run --rm --env-file /srv/tenantly/.env $IMAGE php artisan migrate --force
            IMAGE=$IMAGE docker compose -f /srv/tenantly/compose.prod.yaml up -d --no-deps --wait app horizon scheduler
            docker exec tenantly-horizon-1 php artisan horizon:terminate
          "
